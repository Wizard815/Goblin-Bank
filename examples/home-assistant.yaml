# Home Assistant: a sensor and a refresh button from one worker. Make the token in the app: Settings, Sharing, API tokens.
# Put the token in HA's secrets.yaml as worker_token: gb_alice_xxxxxxxx
sensor:
  - platform: rest
    name: Plaid Firefly Connector
    resource: https://bank.example.com/api/v1/me/ha
    headers:
      Authorization: !secret worker_bank_bearer      # "Bearer gb_alice_xxxxxxxx"
    scan_interval: 900
    value_template: "{{ value_json.net_worth }}"
    json_attributes: [bills_next_7_days, alerts]
rest_command:
  worker_refresh:
    url: https://bank.example.com/api/v1/me/summary?refresh=1
    headers:
      Authorization: !secret worker_bank_bearer
