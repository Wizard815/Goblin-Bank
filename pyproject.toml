[project]
name = "plaidproxy"
version = "0.1.0"
description = "plaid-firefly-connector: CoinGateway + per-person Worker containers + read-only connectors"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29", "pyyaml>=6", "cryptography>=42"]

[project.optional-dependencies]
live = ["robin_stocks"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
