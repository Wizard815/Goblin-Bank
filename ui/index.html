<style>
/* Layout: sidebar ledger nav + one working pane. Teal = money you own, brass = movement, red = money owed/out. */
:root{
  --bg:#edf1f2; --panel:#f8fafa; --line:#d5dde0; --fg:#14232b; --muted:#5a6b73;
  --teal:#17766b; --teal-soft:#d6ece8; --brass:#a8741a; --brass-soft:#f3e6c9; --red:#b3372f; --red-soft:#f5dcd9; --ok:#2b7a3d;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1a1f; --panel:#13242b; --line:#24383f; --fg:#e4eeef; --muted:#8ea4ab;
  --teal:#4cc2b0; --teal-soft:#16393a; --brass:#e0b052; --brass-soft:#3a2f17; --red:#f07f73; --red-soft:#40201e; --ok:#6fcf86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1a1f; --panel:#13242b; --line:#24383f; --fg:#e4eeef; --muted:#8ea4ab;
  --teal:#4cc2b0; --teal-soft:#16393a; --brass:#e0b052; --brass-soft:#3a2f17; --red:#f07f73; --red-soft:#40201e; --ok:#6fcf86; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}

h2{font-size:1.5rem} h3{font-size:1.05rem}
.num,td.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;max-width:1240px;margin:0 auto}
nav.side{display:flex;flex-direction:column;gap:4px;position:sticky;top:16px;align-self:start}
.brand{font:700 1.35rem var(--display);padding:4px 10px 14px;display:flex;align-items:center;gap:10px}
.coin{width:22px;height:22px;border-radius:50%;background:var(--brass);box-shadow:inset 0 0 0 4px var(--brass-soft)}

nav.side button[aria-current="page"]{background:var(--panel);color:var(--fg);box-shadow:inset 3px 0 0 var(--teal)}
nav.side button:hover{color:var(--fg)}
.side .foot{margin-top:16px;padding:0 10px;font-size:.8rem;color:var(--muted);display:grid;gap:8px}
main{min-width:0;display:grid;gap:20px;align-content:start}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.banner{background:var(--brass-soft);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:.88rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.kpi .label{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .value{white-space:nowrap;font:500 1.9rem var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}

.pos{color:var(--teal)} .neg{color:var(--red)}
.comp{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:10px 0 8px}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:600;background:var(--line);color:var(--muted)}
.pill.t{background:var(--teal-soft);color:var(--teal)} .pill.b{background:var(--brass-soft);color:var(--brass)} .pill.r{background:var(--red-soft);color:var(--red)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;font-weight:500}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#062b26}}
.btn.danger{color:var(--red)}
.btn.sm{padding:3px 10px;font-size:.85rem}

label{display:grid;gap:3px;font-size:.78rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

.ev:last-child,tr:last-child td{border-bottom:0}
.url{display:flex;gap:8px;align-items:center}

.muted{color:var(--muted)} .small{font-size:.85rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
svg text{fill:var(--muted);font:11px var(--mono)}
.login{max-width:420px;margin:12vh auto;display:grid;gap:14px}
.toast{position:fixed;bottom:max(16px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.9rem;z-index:20}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 12px;font-size:.85rem;color:var(--fg)}
.chip:hover{border-color:var(--teal)} .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}

input.tiny{width:72px;padding:3px 8px}

.alerts{display:grid;gap:6px}
.alert{border-radius:8px;padding:8px 12px;background:var(--brass-soft);border-left:4px solid var(--brass)}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:9px 14px;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--teal)}
.stack{display:grid;gap:16px;margin-top:4px}
.split{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:16px}

.card{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);min-width:0}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.subform{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;align-items:end}
.subform .custom,.subform .pname{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}.subform .pname{grid-template-columns:1fr}
.subform [hidden]{display:none!important}
.formbtns{display:flex;gap:8px;align-items:end}
label.check{display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--fg)}label.check input{width:auto}
select.bare{width:auto;max-width:150px;padding:3px 6px;font-size:.88rem}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;font:inherit;resize:vertical}
.note{cursor:pointer;padding:8px 6px;border-radius:6px}.note.on{background:var(--teal-soft)}
.pill .x{background:none;border:0;padding:0 0 0 6px;color:inherit;cursor:pointer}
.chat{display:grid;gap:10px;max-height:52vh;overflow-y:auto;padding:4px 2px;margin:8px 0}
.bubble{max-width:88%;padding:9px 13px;border-radius:12px;min-width:0;overflow-wrap:anywhere}
.bubble.me{justify-self:end;background:var(--teal);color:#fff}
:root[data-theme="dark"] .bubble.me{color:#062b26}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bubble.me{color:#062b26}}
.bubble.agent{justify-self:start;background:var(--bg);border:1px solid var(--line)} .bubble.err{border-color:var(--red);color:var(--red)}
.trace{margin-top:6px;font-size:.82rem}.trace summary{cursor:pointer;color:var(--muted)}
#ag-in{min-height:46px}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}.barrow{grid-template-columns:80px 1fr 80px}}
main>*,.stack>*{min-width:0}label{min-width:0}select,input{max-width:100%}.filters{grid-template-columns:repeat(auto-fit,minmax(min(130px,100%),1fr))}.subform{grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr))}
td.mono{white-space:nowrap}
.ctx{display:flex;gap:10px;align-items:center;margin:6px 0}.ctx .meter{flex:1;max-width:260px}.bubble.old{opacity:.55}.added{margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--teal-soft);font-size:.88rem}
.badge{margin-left:8px;background:var(--brass);color:#fff;border-radius:999px;padding:0 7px;font-size:.75rem;font-weight:600}
.snippet{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font:.8rem/1.45 var(--mono);margin:0;white-space:pre}.card.done{opacity:.6}
.ev>*{min-width:0}.ev{overflow-wrap:anywhere}
</style>

/* ---------- API: the gateway (/g/<name>/...) or a recorded sample (shared preview) ---------- */

function demoChats(p, m, opts) {

  if (m !== "GET") { if (path.startsWith("/api/agent/chat")) return Promise.resolve(DEMO.chat); throw new Error("Sample preview: changes are not saved"); }
