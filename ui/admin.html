<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goblin Bank admin</title>
<style>
:root{--bg:#edf1f2;--panel:#f8fafa;--line:#d5dde0;--fg:#14232b;--muted:#5a6b73;--teal:#17766b;--teal-soft:#d6ece8;--red:#b3372f;--red-soft:#f5dcd9;--brass:#a8741a}
@media (prefers-color-scheme:dark){:root{--bg:#0d1a1f;--panel:#13242b;--line:#24383f;--fg:#e4eeef;--muted:#8ea4ab;--teal:#4cc2b0;--teal-soft:#16393a;--red:#f07f73;--red-soft:#40201e;--brass:#e0b052;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Segoe UI",sans-serif;padding:16px max(16px,env(safe-area-inset-left))}
main{max-width:860px;margin:0 auto;display:grid;gap:16px}h1{font-size:1.5rem;margin:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto}
.muted{color:var(--muted)}.small{font-size:.86rem}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr:last-child td{border-bottom:0}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:600}.up{background:var(--teal-soft);color:var(--teal)}.down{background:var(--red-soft);color:var(--red)}
input,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px}button{cursor:pointer}button.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.err{color:var(--red)}
</style>
<main>
  <h1>Goblin Bank admin</h1>
  <p class="muted small">General health and call counts, only when you ask. Nothing here shows what anyone asked for or any of their data, and the gateway keeps no log of requests: no addresses, search terms, tokens or bodies.</p>
  <form class="panel row" id="login"><input id="tok" type="password" placeholder="Admin token" autocomplete="current-password" required style="flex:1;min-width:200px"><button class="primary" type="submit">Check now</button><button type="button" id="reset">Clear counts</button><span id="msg" class="small muted"></span></form>
  <div class="panel" id="out" hidden></div>
  <div class="panel" id="people" hidden></div>
  <div class="panel" id="plaid" hidden></div>
</main>
<script>
const $ = (s) => document.querySelector(s), out = $("#out"), msg = $("#msg");
const el = (t, a = {}, ...k) => { const e = document.createElement(t); for (const [x, v] of Object.entries(a)) e.setAttribute(x, v); k.flat().forEach((c) => e.append(c?.nodeType ? c : document.createTextNode(String(c)))); return e; };
const get = (o, k, f) => (o && o[k] ? o[k][f] : 0);
async function call(path, method = "GET", body) {
  const r = await fetch(path, { method, headers: { Authorization: "Bearer " + $("#tok").value.trim(), ...(body ? { "Content-Type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) throw new Error("That is not the admin token.");
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(typeof j.detail === "string" ? j.detail : "The gateway answered " + r.status); }
  return r.json();
}

const b64 = () => { const a = crypto.getRandomValues(new Uint8Array(32)); return btoa(String.fromCharCode(...a)).replace(/\+/g, "-").replace(/\//g, "_"); };   // a Fernet key; made here, so the gateway never sees it
const composeFor = (n, secret) => `services:
  goblin-${n}:
    build: .
    environment:
      ROLE: goblin
      GOBLIN_NAME: ${n}
      INTERNAL_SECRET: ${secret}
      FIELD_KEY: ${b64()}
      GATEWAY_URL: http://gateway:8000
    env_file: [.secrets/plaid.env]
    volumes: ["./data/${n}/db:/data"]
    user: "10001"
    networks: [edge, egress]
    restart: unless-stopped
`;
const res = el("div");                                    // kept across refreshes so a just-issued login token is not wiped
function renderPeople(rows) {
  const box = $("#people"), note = el("p", { class: "small muted" });
  const add = el("form", { class: "row" }, el("input", { id: "pn", placeholder: "new person's name, e.g. bob", pattern: "[a-z][a-z0-9\\-]{0,30}", required: "", style: "flex:1;min-width:200px" }), el("button", { class: "primary", type: "submit" }, "Add person"));
  add.addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      const r = await call("/admin/people", "POST", { name: $("#pn").value.trim() });
      const file = composeFor(r.name, r.internal_secret);
      res.replaceChildren(el("p", {}, el("b", {}, r.name + " is registered.")), el("p", { class: "small" }, "Give them this login token. It is shown once and is not stored: "), el("pre", { style: "white-space:pre-wrap;word-break:break-all;margin:0" }, r.login_token),
        el("p", { class: "small" }, "Their own container still has to be started once (this page cannot start Docker). Save this as docker-compose." + r.name + ".yml next to your other compose file:"), el("pre", { style: "overflow:auto;background:var(--bg);padding:10px;border-radius:8px;font-size:.8rem" }, file),
        el("p", { class: "small" }, "Then run:"), el("pre", { style: "overflow:auto;background:var(--bg);padding:10px;border-radius:8px;font-size:.8rem" }, `mkdir -p data/${r.name}/db && sudo chown -R 10001:10001 data/${r.name}\ndocker compose -f docker-compose.generated.yml -f docker-compose.${r.name}.yml up -d --build`),
        el("p", { class: "small muted" }, "The encryption key in that file was made in your browser, so the gateway never sees it. Back the file up: losing it means re-linking their banks. Once the container is up they sign in at the normal address with their name and token."));
      $("#pn").value = ""; show();
    } catch (err) { note.textContent = err.message; note.className = "small err"; }
  });
  box.replaceChildren(el("h2", { style: "margin:0 0 6px;font-size:1.1rem" }, "People"), el("p", { class: "small muted" }, "Everyone on this gateway. A person you add here can link with the others from their own Family links tab."),
    el("table", {}, el("tbody", {}, rows.map((g) => el("tr", {}, el("td", {}, g.name), el("td", { class: "small muted" }, g.added_here ? "added here" : "from goblins.yaml"),
      el("td", { class: "n" }, g.added_here ? (() => { const b = el("button", {}, "Remove"); b.addEventListener("click", async () => { if (!confirm("Remove " + g.name + " from the gateway? Their container keeps its data; they just cannot sign in or link.")) return; try { await call("/admin/people/" + encodeURIComponent(g.name), "DELETE"); show(); } catch (err) { note.textContent = err.message; note.className = "small err"; } }); return b; })() : ""))))),
    el("div", { style: "margin-top:12px" }, add), note, res);
  box.hidden = false;
}

const usd = (n) => n == null ? "none" : "$" + Number(n).toFixed(2);
async function renderPlaid(rows) {
  const box = $("#plaid"), pol = await call("/admin/policy"), note = el("p", { class: "small muted" }), bi = pol.built_in;
  const inp = (id, ph, v, step) => el("input", { id, type: "number", min: "0", step: step || "1", placeholder: ph, value: v ?? "", style: "width:110px" });
  const dflt = pol.default || {}, mine = pol.people || {};
  const fD = { b: inp("pd-b", "$" + bi.plaid_budget_month, dflt.plaid_budget_month, "0.01"), c: inp("pd-c", String(bi.plaid_daily_cap), dflt.plaid_daily_cap), m: inp("pd-m", String(bi.plaid_min_minutes), dflt.plaid_min_minutes) };
  const kid = el("input", { id: "pk-i", placeholder: "Client ID", value: dflt.plaid_client_id || "", autocomplete: "off", style: "min-width:220px" }), ksec = el("input", { id: "pk-s", type: "password", placeholder: pol.plaid_secret_set ? "saved, leave blank to keep" : "Secret", autocomplete: "new-password", style: "min-width:220px" });
  const kenv = el("select", { id: "pk-e" }, el("option", { value: "sandbox" }, "Sandbox (fake banks)"), el("option", { value: "production" }, "Production (real banks)")); kenv.value = dflt.plaid_env || "sandbox";
  const kred = el("input", { id: "pk-r", type: "url", placeholder: "optional, if different from the public address", value: dflt.plaid_redirect_url || "", style: "min-width:260px" });
  const ktest = el("button", { type: "button" }, "Test the keys");
  ktest.addEventListener("click", async () => { try { const r = await call("/admin/plaid/test", "POST"); note.textContent = `Plaid accepted the keys (${r.env}).`; note.className = "small"; } catch (e) { note.textContent = e.message; note.className = "small err"; } });
  const pub = el("input", { id: "pd-u", type: "url", placeholder: "https://bank.example.com", value: dflt.public_url || "", style: "min-width:260px" });
  const rec = el("select", { id: "pd-r" }, el("option", { value: "" }, "default (on)"), el("option", { value: "on" }, "on"), el("option", { value: "off" }, "off")); rec.value = dflt.plaid_use_recurring || "";
  const per = rows.map((g) => ({ n: g.name, b: inp("pp-b-" + g.name, "default", (mine[g.name] || {}).plaid_budget_month, "0.01"), c: inp("pp-c-" + g.name, "default", (mine[g.name] || {}).plaid_daily_cap) }));
  const num = (x) => x.value.trim() === "" ? "" : Number(x.value);
  const save = el("button", { class: "primary", type: "button" }, "Save limits");
  save.addEventListener("click", async () => {
    const people = {}; for (const p of per) { const o = {}; if (p.b.value.trim() !== "") o.plaid_budget_month = num(p.b); if (p.c.value.trim() !== "") o.plaid_daily_cap = num(p.c); if (Object.keys(o).length) people[p.n] = o; }
    const d = {}; if (fD.b.value.trim() !== "") d.plaid_budget_month = num(fD.b); if (fD.c.value.trim() !== "") d.plaid_daily_cap = num(fD.c); if (fD.m.value.trim() !== "") d.plaid_min_minutes = num(fD.m); if (rec.value) d.plaid_use_recurring = rec.value; if (pub.value.trim()) d.public_url = pub.value.trim(); if (kid.value.trim()) d.plaid_client_id = kid.value.trim(); if (ksec.value.trim()) d.plaid_secret = ksec.value.trim(); d.plaid_env = kenv.value; if (kred.value.trim()) d.plaid_redirect_url = kred.value.trim();
    try { await call("/admin/policy", "PUT", { default: d, people }); note.textContent = "Saved. Each goblin picks it up within five minutes."; note.className = "small"; } catch (e) { note.textContent = e.message; note.className = "small err"; }
  });
  const total = rows.reduce((a, g) => a + ((g.plaid || {}).est_monthly_cost || 0), 0);
  box.replaceChildren(el("h2", { style: "margin:0 0 6px;font-size:1.1rem" }, "Plaid limits"),
    el("p", { class: "small muted" }, "These are enforced by every goblin and cannot be raised from inside the app. Empty = the built-in default. Budget is each person's own monthly maximum for Plaid (estimated at list price). Plaid bills you the combined total of everyone."),
    el("p", { class: "small muted" }, "Plaid keys for everyone on this server, entered once (from dashboard.plaid.com, Developers, Keys). They are sent to each goblin, which keeps them encrypted; the secret is never shown again. Leave these empty to let each person enter their own."),
    el("div", { class: "row" }, kid, ksec, kenv, ktest),
    el("div", { class: "row" }, el("label", { class: "small" }, "Public address (https) ", pub),
      el("label", { class: "small" }, "Sign-in return address ", kred),
      el("span", { class: "small muted" }, "The address Plaid can reach (a domain, a Cloudflare Tunnel or Tailscale Funnel). Set it and every bank gets webhooks: Plaid tells the app when there is news, so banks are only polled weekly as a safety net, and the sign-in return for OAuth banks works.")),
    el("div", { class: "row" }, el("label", { class: "small" }, "Budget per person ($/month) ", fD.b), el("label", { class: "small" }, "Daily call cap ", fD.c), el("label", { class: "small" }, "Ask a bank at most every (minutes) ", fD.m), el("label", { class: "small" }, "Plaid recurring detection ", rec)),
    el("p", { class: "small muted" }, "Built-in: $5 a month, 300 calls a day, every 180 minutes. Most calls are free; Plaid bills per bank per month (Transactions $0.30, Recurring $0.15, Investments Holdings $0.18)."),
    el("table", {}, el("thead", {}, el("tr", {}, ["Person", "Banks", "Estimated / month", "Their budget", "Calls today", "Webhooks live", "Own budget", "Own daily cap"].map((h, i) => el("th", i > 0 && i < 6 ? { class: "n" } : {}, h)))),
      el("tbody", {}, rows.map((g, i) => { const p = g.plaid || {}; return el("tr", {}, el("td", {}, g.name), el("td", { class: "n" }, p.items ?? "?"), el("td", { class: "n" }, p.est_monthly_cost == null ? "?" : usd(p.est_monthly_cost)), el("td", { class: "n" }, p.budget == null ? "none" : usd(p.budget)), el("td", { class: "n" }, p.calls_today == null ? "?" : `${p.calls_today} / ${p.daily_cap}`), el("td", { class: "n" }, p.items == null ? "?" : p.webhook_set ? `${p.webhook_banks} of ${p.items}` : "not set up"), el("td", {}, per[i].b), el("td", {}, per[i].c)); }))),
    el("p", { class: "small muted" }, `Everyone together: about ${usd(total)} a month. Counts only; nothing about what is in anyone's accounts.`),
    el("div", { class: "row" }, save), note);
  box.hidden = false;
}
async function show() {
  msg.textContent = "Checking…"; msg.className = "small muted";
  try {
    const d = await call("/admin/status"), rows = d.goblins;
    const calls = (g, k, f = "calls") => get(g.calls, k, f);
    out.replaceChildren(
      el("table", {}, el("thead", {}, el("tr", {}, ["Goblin", "Status", "App calls", "Token calls", "Webhooks", "Errors"].map((h, i) => el("th", i > 1 ? { class: "n" } : {}, h)))),
        el("tbody", {}, rows.map((g) => el("tr", {}, el("td", {}, g.name), el("td", {}, el("span", { class: "pill " + (g.up ? "up" : "down") }, g.up ? "up" : "down")),
          el("td", { class: "n" }, calls(g, "app")), el("td", { class: "n" }, calls(g, "api_token")), el("td", { class: "n" }, calls(g, "webhook")),
          el("td", { class: "n" }, ["app", "api_token", "webhook"].reduce((a, k) => a + calls(g, k, "client_errors") + calls(g, k, "server_errors"), 0)))))),
      el("p", { class: "small muted" }, `Pondering Orb summary calls: ${d.orb.calls || 0}. All calls: ${d.total.calls} (${d.total.client_errors} refused or invalid, ${d.total.server_errors} server errors), since the gateway last started or was cleared ${Math.round(d.since_seconds / 60)} minutes ago.`),
      el("p", { class: "small muted" }, d.note));
    out.hidden = false; renderPeople(rows); renderPlaid(rows).catch(() => {}); msg.textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) { msg.textContent = e.message; msg.className = "small err"; out.hidden = true; }
}
$("#login").addEventListener("submit", (e) => { e.preventDefault(); show(); });
$("#reset").addEventListener("click", async () => { try { await call("/admin/reset", "POST"); msg.textContent = "Counts cleared."; await show(); } catch (e) { msg.textContent = e.message; msg.className = "small err"; } });
</script>
