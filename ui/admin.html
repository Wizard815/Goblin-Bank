<main>
  <h1>Plaid Firefly Connector admin</h1>
  <p class="muted small">General health and call counts, only when you ask. Nothing here shows what anyone asked for or any of their data, and the gateway keeps no log of requests: no addresses, search terms, tokens or bodies.</p>
  <form class="panel row" id="login"><input id="tok" type="password" placeholder="Admin password" autocomplete="current-password" required style="flex:1;min-width:200px"><button class="primary" type="submit">Check now</button><button type="button" id="reset">Clear counts</button><span id="msg" class="small muted"></span></form>
  <div class="panel" id="out" hidden></div>
  <div class="panel" id="people" hidden></div>
  <div class="panel" id="person" hidden></div>
  <div class="panel" id="plaid" hidden></div>
  <div class="panel" id="orb" hidden></div>
</main>

  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(typeof j.detail === "string" ? j.detail : "The gateway answered " + r.status); }

}

const b64 = () => { const a = crypto.getRandomValues(new Uint8Array(32)); return btoa(String.fromCharCode(...a)).replace(/\+/g, "-").replace(/\//g, "_"); };   // a Fernet key; made here, so the gateway never sees it

      INTERNAL_SECRET: ${secret}
      FIELD_KEY: ${b64()}
      GATEWAY_URL: http://gateway:8000
    env_file: [.secrets/plaid.env]
    volumes: ["./data/${n}/db:/data"]
    user: "10001"

    restart: unless-stopped

const res = el("div");                                    // kept across refreshes so a just-issued login token is not wiped

    el("table", {}, el("tbody", {}, rows.map((g) => el("tr", {}, el("td", {}, g.name), el("td", { class: "small muted" }, g.added_here ? "added here" : "from goblins.yaml"),

    return el("tr", {}, el("td", {}, el("b", {}, it.institution || "Bank"), it.status ? el("span", { class: "pill down", style: "margin-left:8px" }, it.status === "error" ? "sign in again" : it.status) : null, it.webhook_live ? el("span", { class: "pill up", style: "margin-left:8px" }, "live updates") : null,

  const inv = el("div", { class: "small" }), mins = sel([["30", "30 minutes"], ["60", "1 hour"], ["1440", "1 day"], ["10080", "7 days"]], "60", () => {});

async function show() {
  msg.textContent = "Checking…"; msg.className = "small muted";
  try {
    const d = await call("/admin/status"), rows = d.goblins;
    const calls = (g, k, f = "calls") => get(g.calls, k, f);
    out.replaceChildren(
      el("table", {}, el("thead", {}, el("tr", {}, ["Goblin", "Status", "App calls", "Token calls", "Webhooks", "Errors"].map((h, i) => el("th", i > 1 ? { class: "n" } : {}, h)))),
        el("tbody", {}, rows.map((g) => el("tr", {}, el("td", {}, g.name), el("td", {}, el("span", { class: "pill " + (g.up ? "up" : "down") }, g.up ? "up" : "down")),
          el("td", { class: "n" }, calls(g, "app")), el("td", { class: "n" }, calls(g, "api_token")), el("td", { class: "n" }, calls(g, "webhook")),
          el("td", { class: "n" }, ["app", "api_token", "webhook"].reduce((a, k) => a + calls(g, k, "client_errors") + calls(g, k, "server_errors"), 0)))))),
      el("p", { class: "small muted" }, `Pondering Orb summary calls: ${d.orb.calls || 0}. All calls: ${d.total.calls} (${d.total.client_errors} refused or invalid, ${d.total.server_errors} server errors), since the gateway last started or was cleared ${Math.round(d.since_seconds / 60)} minutes ago.`),
      el("p", { class: "small muted" }, d.note));
    sessionStorage.setItem("gb_admin", $("#tok").value.trim()); out.hidden = false; renderPeople(rows); renderPlaid(rows).catch(() => {}); renderOrb().catch(() => {}); msg.textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) { msg.textContent = e.message; msg.className = "small err"; out.hidden = true; }
}
$("#login").addEventListener("submit", (e) => { e.preventDefault(); show(); });
(async () => {                                              // after a bank that signs you in on its own site sends you back here: reopen Plaid Link and finish
  const saved = sessionStorage.getItem("gb_admin");
  if (saved) { $("#tok").value = saved; await show(); if (new URLSearchParams(location.search).has("oauth_state_id")) { try { await openLink(null, true); } catch (e) { msg.textContent = e.message; msg.className = "small err"; } history.replaceState(null, "", location.pathname); } }
})();
$("#reset").addEventListener("click", async () => { try { await call("/admin/reset", "POST"); msg.textContent = "Counts cleared."; await show(); } catch (e) { msg.textContent = e.message; msg.className = "small err"; } });
</script>
